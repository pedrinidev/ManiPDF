# Compila los instaladores de ManiPDF en cada sistema operativo NATIVO y publica
# una GitHub Release con ellos al subir una etiqueta de versión (p. ej. v0.1.0).
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
name: Build installers

on:
  push:
    tags:
      - 'v*'
  # Permite lanzar el build a mano desde la pestaña Actions (para pruebas, sin
  # crear versión). En ejecuciones manuales NO se publica Release.
  workflow_dispatch:

jobs:
  # Un job por sistema operativo (en paralelo). Cada uno genera SUS instaladores.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Evita que un paso colgado (p. ej. un instalador esperando interacción)
    # mantenga el job corriendo durante horas.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        # `npm install` (no `npm ci`): tolera pequeñas diferencias del lock entre
        # versiones de npm/Node y resuelve lo que falte. Suficiente para compilar.
        run: npm install

      # Ghostscript en la máquina de build, para EMPAQUETARLO dentro de la app en
      # los 3 SO. Si el GS empaquetado no arranca (prueba de ejecución), el script
      # lo descarta y la app cae al aviso amigable.
      - name: Instalar Ghostscript (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript dylibbundler
      - name: Instalar Ghostscript (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Instalar Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe"
          $out = "$env:RUNNER_TEMP\gs-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          # Extraemos el instalador NSIS con 7-Zip (NO lo ejecutamos → no se cuelga
          # esperando interacción). Los archivos quedan en C:\gs\bin, lib, Resource...
          & 7z x $out "-oC:\gs" -y | Out-Null
          if (!(Test-Path 'C:\gs\bin\gswin64c.exe')) { throw 'No se extrajo Ghostscript en C:\gs' }
          Write-Host 'Ghostscript extraido en C:\gs'

      # build:manual + typecheck + electron-vite build + electron-builder (del SO actual).
      - name: Generar instaladores
        run: npm run dist

      - name: Subir instaladores como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.exe

  # Reúne los artefactos de los 3 SO y crea/actualiza la Release de la etiqueta.
  # Solo en pushes de etiqueta (no en ejecuciones manuales de prueba).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para crear la Release
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar Release con los instaladores
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
