appId: com.pedrinimamans.manipdf
productName: ManiPDF
directories:
  output: dist
  buildResources: build
# El "FileDescription" del .exe (nombre que Windows muestra en "Abrir con…") sale
# de description. Lo fijamos a "ManiPDF" SOLO en el empaquetado, sin cambiar la
# descripción del repo en package.json.
extraMetadata:
  description: ManiPDF
files:
  - out/**/*
  - package.json
# tesseract.js carga su worker y su wasm desde el sistema de archivos en runtime;
# dentro del asar no los encontraría, así que se desempaquetan.
asarUnpack:
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'
# El manual de usuario se copia a la carpeta resources del paquete; la app lo
# muestra la primera vez que se abre.
extraResources:
  - from: build/manual.pdf
    to: manual.pdf
  # Ghostscript empaquetado (binario + librerías + recursos) generado por
  # scripts/bundle-gs.mjs para la plataforma del build. Permite separación de
  # color / grises sin que el usuario instale nada. (Solo la subcarpeta del SO
  # actual existe en cada build.)
  - from: resources/gs
    to: gs
# Asocia los .pdf con ManiPDF: aparecerá en "Abrir con…" del sistema (no se pone
# como predeterminado; eso lo decide el usuario). Solo aplica a la app empaquetada.
fileAssociations:
  - ext: pdf
    name: PDF
    description: Documento PDF
    role: Editor
    mimeType: application/pdf
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  # Sin certificado de firma: se genera sin firmar (macOS pedirá confirmación la
  # 1a vez: clic derecho > Abrir).
  identity: null
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Office
